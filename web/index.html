  <style>
    /* Ensure fonts load properly from Google Fonts with display=swap so text renders under 3s (#13) */
    @import url('https://fonts.googleapis.com/icon?family=Material+Icons');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
    }

    #root {
      width: 100%;
      -webkit-overflow-scrolling: touch;
      margin: 0px;
      padding: 0px;
      min-height: 100%;
      flex-shrink: 0;
      flex-basis: auto;
      flex-grow: 1;
      display: flex;
      flex: 1;
    }

    html, body {
      scroll-behavior: smooth;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #F9FAFB;
      color: #111827;
    }

    body {
      overflow-y: auto;
      overscroll-behavior-y: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
    }

    .material-icons {
      font-feature-settings: 'liga';
      -webkit-font-feature-settings: 'liga';
      -moz-font-feature-settings: 'liga';
    }
  </style>
